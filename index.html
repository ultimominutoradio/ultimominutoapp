<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="Actualidad deportiva libre e independiente">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Último Minuto</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
}

iframe {
display: block;
width: 100%;
height: 100%;
border: 0;
}
</style>
</head>
<body>
<iframe
src="https://ultimominutoradio.blogspot.com/"
title="Último Minuto">
</iframe>
  <script>
if ("serviceWorker" in navigator) {
window.addEventListener("load", () => {
navigator.serviceWorker.register("/sw.js")
.then(() => console.log("Último Minuto: aplicación preparada"))
.catch(error => console.error("Error del service worker:", error));
});
}
</script>
</body>
</html>
