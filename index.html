<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="Actualidad deportiva libre e independiente">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Último Minuto</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
font-family: Arial, sans-serif;
}

iframe {
display: block;
width: 100%;
height: 100%;
border: 0;
}

#notification-panel {
position: fixed;
z-index: 9999;
right: 14px;
bottom: 18px;
display: flex;
flex-direction: column;
align-items: flex-end;
gap: 6px;
}

#notification-button {
border: 0;
border-radius: 24px;
padding: 12px 17px;
background: #101827;
color: white;
font-size: 14px;
font-weight: bold;
box-shadow: 0 3px 12px rgba(0,0,0,.3);
cursor: pointer;
}

#notification-button:disabled {
opacity: .6;
cursor: wait;
}

#notification-status {
max-width: 260px;
padding: 5px 9px;
border-radius: 8px;
background: rgba(16,24,39,.92);
color: white;
font-size: 11px;
text-align: right;
}
</style>
</head>

<body>

<iframe
src="https://ultimominutoradio.blogspot.com/"
title="Último Minuto">
</iframe>

<div id="notification-panel">
<button id="notification-button" type="button">
🔔 Activar notificaciones
</button>
<div id="notification-status" role="status">
Avisos de Último Minuto
</div>
</div>

<script>
const PUBLIC_VAPID_KEY = "BC7A6J2oRXJQ78VrBgCtbCPNe-0hNzIpGnUCt85titSrxLm7zzZRO9XLQ_8gG2OgJ6jZbLKeUt_BGx6RSPO3zwQ";

const button = document.getElementById("notification-button");
const statusText = document.getElementById("notification-status");

function urlBase64ToUint8Array(base64String) {
const padding = "=".repeat((4 - base64String.length % 4) % 4);
const base64 = (base64String + padding)
.replace(/-/g, "+")
.replace(/_/g, "/");

const rawData = atob(base64);
return Uint8Array.from(
[...rawData].map(char => char.charCodeAt(0))
);
}

function setStatus(message) {
statusText.textContent = message;
}

async function updateNotificationState() {
if (
!("serviceWorker" in navigator) ||
!("PushManager" in window) ||
!("Notification" in window)
) {
button.disabled = true;
button.textContent = "Avisos no compatibles";
setStatus("Este navegador no admite notificaciones push.");
return;
}

try {
const registration = await navigator.serviceWorker.ready;
const subscription =
await registration.pushManager.getSubscription();

if (subscription) {
button.textContent = "🔕 Desactivar notificaciones";
setStatus("Notificaciones activadas");
} else {
button.textContent = "🔔 Activar notificaciones";
setStatus("Avisos de Último Minuto");
}
} catch (error) {
setStatus("No se pudo comprobar el estado de los avisos.");
}
}

async function toggleNotifications() {
button.disabled = true;

try {
const registration = await navigator.serviceWorker.ready;

let subscription =
await registration.pushManager.getSubscription();

// Desactivar notificaciones
if (subscription) {
const response = await fetch("/api/unsubscribe", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
endpoint: subscription.endpoint
})
});

if (!response.ok) {
throw new Error("No se pudo eliminar el registro.");
}

await subscription.unsubscribe();

setStatus("Notificaciones desactivadas.");
button.textContent = "🔔 Activar notificaciones";
return;
}

// Activar notificaciones
if (Notification.permission === "denied") {
setStatus("Permiso bloqueado. Revisa los ajustes del navegador.");
return;
}

const permission = await Notification.requestPermission();

if (permission !== "granted") {
setStatus("No se ha concedido permiso para los avisos.");
return;
}

subscription = await registration.pushManager.subscribe({
userVisibleOnly: true,
applicationServerKey:
urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
});

const response = await fetch("/api/subscribe", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify(subscription.toJSON())
});

if (!response.ok) {
await subscription.unsubscribe();
throw new Error("No se pudo guardar la suscripción.");
}

button.textContent = "🔕 Desactivar notificaciones";
setStatus("¡Notificaciones activadas correctamente!");

} catch (error) {
console.error("Error con las notificaciones:", error);
setStatus("No se pudo completar la operación. Inténtalo de nuevo.");
} finally {
button.disabled = false;
}
}

button.addEventListener("click", toggleNotifications);

if ("serviceWorker" in navigator) {
window.addEventListener("load", async () => {
try {
await navigator.serviceWorker.register("/sw.js");
await updateNotificationState();
console.log("Último Minuto: aplicación preparada");
} catch (error) {
console.error("Error del service worker:", error);
setStatus("No se pudo preparar el sistema de notificaciones.");
}
});
}
</script>

</body>
</html>
